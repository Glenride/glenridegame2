[project]
name = "glenride-game-bot"
version = "0.1.0"
description = "Telegram romance simulation game bot"
authors = [{ name = "Glenride" }]
license = "LicenseRef-Proprietary"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==21.4",
    "pydantic>=2.8,<3.0",
    "httpx>=0.27,<0.28"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.3,<0.7.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23,<0.24"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]
exclude = ["tests*", "content*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
